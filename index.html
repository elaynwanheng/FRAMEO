<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fff">
<link rel="manifest" href="./manifest.webmanifest">
<title>frameo. PHOTO BOOTH</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}
body{min-height:100dvh}
.screen{width:100%;height:100dvh;display:flex;flex-direction:column;align-items:center;padding:clamp(18px,4vh,48px) 18px 24px}
.logo{width:min(260px,58vw);height:auto;object-fit:contain;margin:0 auto clamp(20px,4vh,42px)}
.camera-wrap{width:min(86vw,620px);aspect-ratio:3/4;position:relative;background:#111;overflow:hidden}
video{display:block;width:100%;height:100%;object-fit:cover;transform:none!important}
.countdown{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#fff;font-size:min(22vw,150px);font-weight:700;background:rgba(0,0,0,.12);z-index:2}
.take{margin-top:clamp(22px,4vh,42px);border:0;background:#111;color:#fff;border-radius:999px;padding:22px 58px;font-size:clamp(17px,2.8vw,28px);font-weight:700;letter-spacing:2px}
.receipt-screen{justify-content:flex-start;overflow:auto}
.receipt{width:105mm;min-height:148mm;max-width:94vw;background:#fff;padding:7mm 7mm 6mm;display:flex;flex-direction:column;align-items:center}
.time{font-family:monospace;font-size:12px;margin-bottom:5mm;align-self:flex-start}
.photo{width:100%;aspect-ratio:3/4;object-fit:cover;filter:none;display:block}
.receipt-logo{width:58%;margin-top:6mm;object-fit:contain}
.actions{display:flex;gap:12px;margin-top:18px;padding-bottom:24px}
.actions button{border:0;border-radius:999px;padding:15px 25px;font-weight:700}
.retake{background:#eee;color:#111}
.print{background:#111;color:#fff}
.hidden{display:none!important}
.lock-dot{position:fixed;right:0;bottom:0;width:42px;height:42px;opacity:.01}
.pin{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:20}
.pinbox{background:#fff;padding:24px;border-radius:18px;text-align:center}
.pinbox input{font-size:22px;padding:10px;width:150px;text-align:center}
.pinbox button{margin-top:12px;padding:10px 20px}
@media print{
  @page{size:A7 portrait;margin:0}
  html,body{width:105mm;height:148mm;overflow:hidden}
  .receipt-screen{padding:0!important;display:block!important}
  .receipt{width:105mm;min-height:148mm;max-width:none;padding:7mm 7mm 6mm}
  .actions,.lock-dot{display:none!important}
}
</style>
</head>
<body>
<div id="shoot" class="screen">
  <img class="logo" src="./frameo-logo.png" alt="frameo. PHOTO BOOTH">
  <div class="camera-wrap">
    <video id="video" autoplay playsinline muted></video>
    <div id="countdown" class="countdown"></div>
  </div>
  <button id="take" class="take">TAKE PHOTO</button>
</div>

<div id="result" class="screen receipt-screen hidden">
  <div class="receipt">
    <div id="time" class="time"></div>
    <img id="photo" class="photo" alt="Captured photo">
    <img class="receipt-logo" src="./frameo-logo.png" alt="frameo. PHOTO BOOTH">
  </div>
  <div class="actions">
    <button id="retake" class="retake">RETAKE</button>
    <button id="print" class="print">PRINT</button>
  </div>
</div>

<div id="pin" class="pin">
  <div class="pinbox">
    <div>Settings</div>
    <input id="pinInput" type="password" inputmode="numeric" maxlength="4">
    <br><button id="pinClose">CLOSE</button>
  </div>
</div>
<div id="lockDot" class="lock-dot"></div>

<script>
const video=document.getElementById('video');
const shoot=document.getElementById('shoot');
const result=document.getElementById('result');
const take=document.getElementById('take');
const countdown=document.getElementById('countdown');
const photo=document.getElementById('photo');
const timeEl=document.getElementById('time');
const streamPromise=navigator.mediaDevices.getUserMedia({
  video:{facingMode:{ideal:'user'},width:{ideal:1280},height:{ideal:1600}},
  audio:false
}).then(s=>{video.srcObject=s;return s});

function stamp(){
  const d=new Date();
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function countdown3(){
  return new Promise(resolve=>{
    let n=3; countdown.textContent=n; countdown.style.display='flex';
    const t=setInterval(()=>{
      n--;
      if(n===0){clearInterval(t);countdown.style.display='none';resolve();}
      else countdown.textContent=n;
    },1000);
  });
}

take.onclick=async()=>{
  take.disabled=true;
  try{
    await streamPromise;
    await countdown3();

    const w=video.videoWidth,h=video.videoHeight;
    const target=3/4;
    let sw=w,sh=Math.round(w/target),sx=0,sy=0;
    if(sh>h){sh=h;sw=Math.round(h*target);sx=Math.round((w-sw)/2);}
    const c=document.createElement('canvas');
    c.width=sw;c.height=sh;
    const ctx=c.getContext('2d');

    // IMPORTANT:
    // Preview stays exactly as shown (not mirrored).
    // The captured image is flipped horizontally once, as requested.
    ctx.translate(sw,0);
    ctx.scale(-1,1);
    ctx.drawImage(video,sx,sy,sw,sh,0,0,sw,sh);

    // Brighten the actual captured pixels (not just the preview).
    // Gamma lift keeps shadow detail visible while preserving the requested B&W look.
    const img = ctx.getImageData(0,0,sw,sh);
    const d = img.data;
    for(let i=0;i<d.length;i+=4){
      const lum = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
      const g = Math.min(255, Math.round(255 * Math.pow(lum/255, 0.68)));
      d[i]=d[i+1]=d[i+2]=g;
    }
    ctx.putImageData(img,0,0);

    photo.src=c.toDataURL('image/jpeg',.94);
    timeEl.textContent=stamp();
    shoot.classList.add('hidden');
    result.classList.remove('hidden');
  }catch(e){
    alert('Camera access is required.');
  }finally{take.disabled=false;}
};

document.getElementById('retake').onclick=()=>{
  result.classList.add('hidden');
  shoot.classList.remove('hidden');
};
document.getElementById('print').onclick=()=>window.print();

// Hidden 5-tap settings lock (development PIN 2026)
let taps=0,last=0;
document.getElementById('lockDot').onclick=()=>{
  const now=Date.now();
  taps=(now-last<700)?taps+1:1; last=now;
  if(taps>=5){
    taps=0;
    document.getElementById('pin').style.display='flex';
    document.getElementById('pinInput').focus();
  }
};
document.getElementById('pinClose').onclick=()=>document.getElementById('pin').style.display='none';

window.addEventListener('beforeunload',e=>{ if(video.srcObject) video.srcObject.getTracks().forEach(t=>t.stop()); });
</script>
</body>
</html>
